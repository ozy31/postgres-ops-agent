name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: ruff and pytest
        run: make check

  e2e:
    # The real server, over MCP stdio, as the agent's service account and
    # database role, against CloudNativePG on kind.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          source e2e/versions.env
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: kind, CloudNativePG and the test cluster
        run: make e2e-up
      - name: RBAC, tools and faults
        run: make e2e
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n orders get cluster,backup,objectstore -o wide || true
          tail -50 .state/audit.jsonl || true
